<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – Haroun Ayari</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0E0E0C;
            --text:#F5F5F0;
            --text-light:#B8B8B0;
            --text-muted:#555550;
            --accent:#52B788;
            --border:#2A2A28;
            --font-heading:'Playfair Display',Georgia,serif;
            --font-body:'Outfit',Helvetica,Arial,sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
        .code{font-family:var(--font-heading);font-size:6rem;color:var(--accent);font-weight:400;line-height:1;margin-bottom:1.5rem;opacity:0.4}
        h1{font-family:var(--font-heading);font-size:2rem;font-weight:500;margin-bottom:1rem}
        p{color:var(--text-light);font-size:1rem;margin-bottom:2.5rem;max-width:380px;line-height:1.7}
        a{display:inline-block;padding:0.85rem 2.2rem;background:var(--accent);color:#0E0E0C;border-radius:8px;font-size:0.9rem;font-weight:600;text-decoration:none;transition:opacity 0.3s}
        a:hover{opacity:0.8}
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for may have moved or no longer exists.</p>
    <a href="/">Return home</a>
</body>
</html>
